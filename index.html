<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆瓣小组</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e16'/%3E%3Ccircle cx='25' cy='32' r='13' fill='%237ec8a0'/%3E%3Ccircle cx='40' cy='32' r='13' fill='%236ab0d6' fill-opacity='0.85'/%3E%3C/svg%3E">
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono", "Menlo", "Consolas", monospace;
  --bg: #0a0e16;
  --bg-elevated: #111;
  --bg-gradient-1: rgba(25,55,45,0.2);
  --bg-gradient-2: rgba(30,45,90,0.05);
  --text: #c8c8c8;
  --text-secondary: #b0b0b0;
  --text-muted: #555;
  --text-dim: #444;
  --text-emphasis: #e0e0e0;
  --border: #1a1a1a;
  --border-subtle: #141414;
  --border-medium: #2a2a2a;
  --accent: #7ec8a0;
  accent-color: var(--accent);
  --accent-bg: #1a3a2a;
  --fav: #f0c040;
  --error: #e07070;
  --header-bg: rgba(10,12,14,0.75);
  --card-bg: rgba(255,255,255,0.015);
  --card-hover: rgba(255,255,255,0.035);
  --scrollbar-track: #111;
  --scrollbar-thumb: #333;
  --accent-highlight: rgba(126,200,160,0.4);
  --accent-border: rgba(126,200,160,0.3);
  --accent-subtle: rgba(126,200,160,0.06);
  --accent-glow: rgba(126,200,160,0.08);
  --accent-secondary: #6ab0d6;
  --bg-elevated-hover: rgba(26,26,26,0.9);
  --card-shadow: 0 2px 10px rgba(0,0,0,0.22);
}

[data-theme="light"] {
  --bg: #f4ede1;
  --bg-elevated: #ece4d5;
  --bg-gradient-1: rgba(196,156,110,0.14);
  --bg-gradient-2: rgba(150,180,140,0.08);
  --text: #37322b;
  --text-secondary: #6e675c;
  --text-muted: #908878;
  --text-dim: #a89f8e;
  --text-emphasis: #292520;
  --border: #d9d0bf;
  --border-subtle: #e5dccb;
  --border-medium: #cbc1ae;
  --accent: #2e8b5f;
  --accent-bg: #d9e8d3;
  --fav: #c08a10;
  --error: #c05050;
  --header-bg: rgba(244,237,225,0.85);
  --card-hover: rgba(120,100,70,0.06);
  --accent-highlight: rgba(46,139,95,0.28);
  --accent-border: rgba(46,139,95,0.22);
  --accent-subtle: rgba(46,139,95,0.08);
  --accent-glow: rgba(46,139,95,0.1);
  --accent-secondary: #5a8f9a;
  --bg-elevated-hover: rgba(120,100,70,0.07);
  --scrollbar-track: #e4dccb;
  --scrollbar-thumb: #c4baa8;
  --card-bg: rgba(251,245,235,0.72);
  --card-shadow: 0 2px 10px rgba(140,110,70,0.1);
}

/* ---- Reset & base ---- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 15px; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 0%, var(--bg-gradient-1) 0%, var(--bg) 65%),radial-gradient(ellipse at 80% 100%, var(--bg-gradient-2, transparent) 0%, transparent 50%);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.6;
  min-height: 100vh;
  scroll-behavior: smooth;
  display: flex;
  flex-direction: column;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
}

/* Keep the monospace feel only for "data" elements (IDs, meta, labels,
   keyboard keys) so long Chinese prose reads in a comfortable sans-serif. */
.brand, .group-id, .meta, .comment .time, .comment .floor, .section-title,
.sort-label, .status, .shortcut-row .key, .nav-path, .group-count,
.replies, .fav-count, .sort-btn {
  font-family: var(--font-mono);
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg-elevated); }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

/* ---- Structure ---- */
.container {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 20px;
  width: 100%;
}

/* ---- Header ---- */
header.scrolled {
  box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 1px 0 rgba(126,200,160,0.06);
  border-bottom-color: var(--border-medium);
}

header {
  border-bottom: 1px solid var(--border-subtle);
  border-image: linear-gradient(90deg, transparent, rgba(126,200,160,0.15), transparent) 1;
  padding: 18px 0 14px;
  position: sticky;
  top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  z-index: 10;
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.brand {
  font-size: 1rem;
  font-weight: 700;
  background: linear-gradient(135deg, #7ec8a0, #6ab0d6, #a078d0);
  background-size: 200% 200%;
  animation: shimmerText 4s ease infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.nav-path {
  font-size: 0.8rem;
  color: var(--text-muted);
}
.nav-path span { color: var(--text-muted); }
.nav-path .active { color: var(--text-muted); }

/* ---- Input ---- */
.input-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex: 1;
  min-width: 200px;
}
.input-row input {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  color: var(--text);
  padding: 8px 12px;
  font: inherit;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.15s;
}
.input-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-subtle), 0 0 24px var(--accent-glow);
}
.input-row input::placeholder { color: var(--text-dim); }

/* ---- Discussion / post search ---- */
.disc-search-wrap, .post-search-wrap {
  margin: 10px 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.disc-search, .post-search {
  flex: 1;
  max-width: 340px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  color: var(--text);
  padding: 6px 12px;
  font: inherit;
  font-size: 0.75rem;
  outline: none;
  border-radius: 6px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.disc-search:focus, .post-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-subtle);
}
.disc-search::placeholder, .post-search::placeholder { color: var(--text-dim); }
.post-search { max-width: 260px; }
.btn {
  background: var(--border);
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 8px 16px;
  font: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  border-radius: 6px;
}
.btn:hover { background: var(--bg-elevated-hover); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 24px var(--accent-subtle); }
.btn-primary { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent); }
.btn-primary:hover { background: var(--accent-bg); border-color: var(--accent); }
.theme-btn {
  background: none;
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 0;
  font-size: 1rem;
  cursor: pointer;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  line-height: 1;
  flex-shrink: 0;
}
.theme-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 16px var(--accent-subtle);
}
.theme-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 16px var(--accent-subtle);
}

/* ---- Minimal mode image placeholders ---- */
.img-ph-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 88px;
  min-height: 48px;
  padding: 6px 10px;
  background: var(--bg-elevated);
  border: 1px dashed var(--border-medium);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 0.65rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  line-height: 1.4;
}
.img-ph-label:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-subtle);
}
.comment-imgs .img-ph-label { min-width: 72px; min-height: 40px; }
.minimal-mode .image-gallery .img-box,
.minimal-mode .comment-imgs .img-box { display: inline-block; }

.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
.btn-back { margin-right: 4px; }

/* ---- Status bar ---- */
.status {
  padding: 10px 0;
  font-size: 0.75rem;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
  min-height: 36px;
}
.status.loading { color: var(--accent); }
.status.error { color: var(--error); }
.status .info { color: var(--text-muted); }

/* ---- Main content ---- */
main {
  flex: 1;
  padding: 20px 0;
}

/* ---- Group list ---- */
.group-list {
  list-style: none;
}
.group-list li {
  border-bottom: 1px solid var(--border-subtle);
}
.group-list li a {
  display: block;
  padding: 10px 8px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  transition: all 0.15s;
  border-radius: 6px;
}
.group-list li a:hover {
  background: var(--bg-elevated);
  color: var(--accent);
  padding-left: 14px;
}
.group-list li .group-id {
  color: var(--text-dim);
  font-size: 0.7rem;
  margin-left: 8px;
}

/* ---- Discussion list ---- */
.disc-list { list-style: none; }
.disc-list, .post-header, .comments-section {
  animation: fadeIn 0.35s ease both;
}

.disc-item {
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  margin: 3px 0;
  padding: 14px 16px;
  cursor: pointer;
  background: var(--card-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: var(--card-shadow);
  transition: all 0.25s ease;
}
.disc-item:hover {
  background: var(--card-hover);
  border-color: var(--accent-subtle);
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(126,200,160,0.08);
}
.disc-item .title {
  font-size: 0.9rem;
  color: var(--text-emphasis);
  margin-bottom: 4px;
  line-height: 1.5;
}
.disc-item .title a {
  color: inherit;
  text-decoration: none;
}
.disc-item:hover .title a { color: var(--accent); }
.disc-item .meta {
  font-size: 0.7rem;
  color: var(--text-muted);
  display: flex;
  gap: 16px;
}
.disc-item .meta .author { color: var(--text-muted); }
.disc-item .meta .replies {
  color: var(--accent);
  background: var(--accent-subtle);
  border: 1px solid var(--accent-border);
  border-radius: 999px;
  padding: 0 8px;
  font-size: 0.62rem;
  line-height: 1.6;
}
.disc-item .title a { transition: color 0.15s; }
.disc-item.read { opacity: 0.72; }
.disc-item.read .title,
.disc-item.read .title a { color: var(--text-dim); }
.disc-item.read:hover { opacity: 0.9; }

/* ---- Post detail ---- */
.post-header {
  margin-bottom: 24px;
}
.post-header h2 {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-emphasis);
  line-height: 1.55;
  letter-spacing: 0.01em;
  margin-bottom: 8px;
}
.post-header .meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex;
  gap: 16px;
}
.post-body {
  font-size: 0.9rem;
  line-height: 1.9;
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-wrap: break-word;
  padding: 20px 16px;
  margin: 8px 0 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
}
mark {
  background: var(--accent-highlight);
  color: var(--text-emphasis);
  padding: 0 2px;
  border-radius: 2px;
}
::selection {
  background: var(--accent-highlight);
  color: var(--text-emphasis);
}

/* ---- Comments ---- */
.comments-section h3 {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.comment {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.15s;
}
.comment:hover { background: var(--card-hover); }
.comment:last-child { border-bottom: none; }
.comment .author {
  font-size: 0.75rem;
  color: var(--accent);
  margin-bottom: 4px;
  font-weight: 500;
}
.comment .time {
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-left: 8px;
}
.comment .floor {
  color: var(--text-dim);
  font-size: 0.7rem;
  margin-right: 4px;
}
.comment .content {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.comment-imgs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.comment-imgs a {
  display: inline-block;
  line-height: 0;
  border-radius: 6px;
  overflow: hidden;
}
.comment-imgs img {
  max-width: 140px;
  max-height: 140px;
  object-fit: cover;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  cursor: zoom-in;
  transition: all 0.15s;
  background: var(--bg-elevated);
}
.comment-imgs img:hover {
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: scale(1.03);
}
.comment-locked {
  padding: 20px 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  border: 1px dashed var(--border-medium);
  border-radius: 8px;
}

/* ---- Section title ---- */
.section-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-subtle);
}

/* ---- Empty / Welcome ---- */
.welcome {
  text-align: center;
  padding: 60px 20px;
}
.welcome .glyph {
  font-size: 1.5rem;
  width: 64px;
  height: 64px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  border: 1px solid var(--accent-border);
  border-radius: 50%;
  background: var(--accent-subtle);
  box-shadow: 0 0 40px var(--accent-glow);
}
.welcome p {
  color: var(--text-muted);
  font-size: 0.85rem;
  line-height: 2;
}
.welcome .hint {
  color: var(--accent);
  font-size: 0.8rem;
  margin-top: 20px;
  opacity: 0.8;
}
.welcome .example {
  color: var(--text-muted);
  font-size: 0.75rem;
  margin-top: 8px;
}
.welcome .example span {
  display: inline-block;
  background: var(--bg-elevated);
  padding: 2px 8px;
  border: 1px solid var(--border-medium);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.15s;
}
.welcome .example span:hover {
  background: var(--accent-subtle);
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
}

/* ---- Quick nav ---- */
.quick-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 20px;
}
.quick-nav button {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 10px;
  font: inherit;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.15s;
  border-radius: 4px;
}
.quick-nav button:hover { color: var(--accent); border-color: var(--border-medium); }

/* ---- Footer ---- */
footer {
  border-top: 1px solid var(--border);
  padding: 14px 0;
  font-size: 0.65rem;
  color: var(--text-dim);
 text-align: center;
}

/* ---- Image gallery ---- */
.image-gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.image-gallery img {
  max-width: 200px;
  max-height: 200px;
  object-fit: cover;
  border: 1px solid var(--border-medium);
  border-radius: 2px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.image-gallery img:hover {
  border-color: var(--accent-highlight);
  box-shadow: 0 0 20px var(--accent-glow);
}

/* ---- Favorite groups ---- */
.fav-toggle {
  background: none;
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 4px 10px;
  font: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
  margin-left: 6px;
}
.fav-toggle:hover { border-color: var(--accent); color: var(--accent); }
.fav-toggle.active { color: var(--fav); border-color: var(--fav); }
.fav-toggle.active:hover { border-color: var(--fav); }
.fav-bar {
  margin: 8px 0 12px;
  display: none;
}
.fav-bar.show { display: block; }
.fav-bar .fav-card {
  background: var(--card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 10px 14px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: var(--card-shadow);
}
.fav-bar .fav-label {
  display: block;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.fav-bar .fav-label .fav-count {
  color: var(--fav);
  font-size: 0.65rem;
  margin-left: 4px;
}
.fav-bar .fav-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.fav-tag {
  display: inline-block;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  color: var(--fav);
  padding: 3px 10px;
  font-size: 0.7rem;
  cursor: pointer;
  margin: 3px;
  transition: all 0.15s;
}
.fav-tag:hover { border-color: var(--fav); background: rgba(240,192,64,0.06); }
.fav-del {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
  margin-left: 6px;
  padding: 0 3px;
  line-height: 1;
  border-radius: 50%;
  transition: all 0.15s;
  font-family: inherit;
}
.fav-del:hover {
  color: var(--error);
  background: rgba(192,80,80,0.12);
}
.recent-tag {
  display: inline-block;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  color: var(--text-secondary);
  padding: 3px 10px;
  font-size: 0.7rem;
  cursor: pointer;
  margin: 3px;
  border-radius: 4px;
  transition: all 0.15s;
}
.recent-tag:hover {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-subtle);
}
.fav-count { color: var(--text-muted); font-size: 0.65rem; margin-left: 2px; }

/* ---- Responsive ---- */
@media (max-width: 640px) {
  html { font-size: 15px; }
  .container { padding: 0 12px; }
  .header-inner { gap: 6px; }
  .header-inner .brand { flex: 0 0 100%; text-align: center; }
  .input-row { flex: 1; min-width: 0; }
  .input-row input { font-size: 0.8rem; padding: 6px 10px; }
  .btn { padding: 6px 12px; font-size: 0.75rem; }
  .btn-sm { padding: 3px 8px; font-size: 0.7rem; }
  .section-title { font-size: 0.65rem; }

/* ---- Floating actions ---- */
.float-actions {
  position: fixed;
  bottom: 24px;

  gap: 8px;

}

  pointer-events: auto;
}
.float-sub {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.22s ease, opacity 0.22s ease;
}
.float-actions.expanded .float-sub {
  max-height: 200px;
  opacity: 1;
}
.float-more {
  transition: transform 0.22s ease;
}
.float-actions.expanded .float-more {
  transform: rotate(180deg);
}
.float-btn {

  height: 42px;
  border: 1px solid var(--border-medium);

  backdrop-filter: blur(8px);

  font-size: 1.1rem;
  cursor: pointer;
  border-radius: 50%;

  align-items: center;
  justify-content: center;

/* ---- Loading animation ---- */
@keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
.loading-dots span {
 animation: pulse 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ---- Lightbox ---- */
.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);

  align-items: center;
  justify-content: center;
}
.lightbox.show {

}
.lightbox img {
  max-width: 90%;
  max-height: 90%;

}
.lightbox-close {

  right: 20px;

  font-size: 1.4rem;

  z-index: 202;

  transition: color 0.15s, transform 0.15s;
}
.lightbox-close:hover {
  color: #fff;

}


/* ---- Animations ---- */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {

.disc-list li:nth-child(6) { animation-delay: 0.12s; }
.disc-list li:nth-child(7) { animation-delay: 0.14s; }

/* ---- Loading bar ---- */
.loading-bar {

  top: 0;
  left: 0;

}
.loading-bar.active {

@keyframes loadingSlide {

/* ---- Refined loading dots ---- */
.status.loading { position: relative; padding-left: 20px; }
.status.loading::before {
  content: '';

  left: 0;
  top: 50%;
  width: 12px; height: 12px;
  margin-top: -6px;

  border-radius: 50%;

/* ---- Reading progress ---- */
.reading-progress {

/* ---- Toast notifications ---- */

/* ---- Lightbox image counter ---- */

/* ---- Respect reduced motion ---- */
@media (prefers-reduced-motion: reduce) {

    animation-duration: 0.01ms !important;

    transition-duration: 0.01ms !important;

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const app = $('#app');
const status = $('#status');
const APP_VERSION = '1.0.1';
var _isHistoryRestore = false;

function setStatus(msg, type) {
  status.className = 'status' + (type ? ' ' + type : '');
  status.innerHTML = msg;
  if (!type || type !== 'loading') hideLoading();
}

function loading(msg) {
  setStatus(`<span class="loading-dots">${msg}<span>.</span><span>.</span><span>.</span></span>`, 'loading');
  showLoading();
}

function showLoading() {
  var bar = document.getElementById('loadingBar');
  if (bar) bar.classList.add('active');
}
function hideLoading() {
  var bar = document.getElementById('loadingBar');
  if (bar) bar.classList.remove('active');
}

// ---- Navigation helpers ----

// Shared renderer for a discussion list item, used by the initial render,
// scroll-to-load-more and sort so `content-visibility` stays consistent.
function discItemHtml(groupId, d) {
  var title = escapeHtml(d.title);
  var author = escapeHtml(d.author || '匿名');
  var replies = d.replies || '0';
  var time = escapeHtml(d.lastReply || '');
  var html = `<li class="disc-item${isRead(groupId, d.id) ? ' read' : ''}" onclick="loadPost('${groupId}', '${d.id}');" style="content-visibility:auto;contain-intrinsic-size:80px;">`;
  html += `<div class="title"><a href="#" onclick="event.stopPropagation(); loadPost('${groupId}', '${d.id}'); return false;">${title}</a></div>`;
  html += `<div class="meta"><span class="author">${author}</span><span class="replies">${replies} 回复</span>`;
  if (time) html += `<span>${time}</span>`;
  html += '</div></li>';
  return html;
}

// Update the "已显示 X / Y" load-more hint under the discussion list.
function updateListMore() {
  var el = document.getElementById('listMore');
  if (!el) return;
  var list = discussionFullData[selectedGroupId];
  if (!list) { el.textContent = ''; return; }
  var cur = list._vc || 0;
  if (cur < list.length) {
    el.textContent = '已显示 ' + cur + ' / ' + list.length + ' 条 · 继续滚动加载…';
  } else {
    el.textContent = '已全部加载 · 共 ' + list.length + ' 条';
  }
}

// Update the comment count hint at the bottom of the comments section.
function updateCommentMore() {
  var el = document.getElementById('commentMore');
  if (!el) return;
  var comments = _postComments;
  if (!comments || !comments.length) { el.textContent = ''; return; }
  var cur = comments._vc || 0;
  if (cur < comments.length) {
    el.textContent = '已显示 ' + cur + ' / ' + comments.length + ' 条回应 · 继续滚动加载…';
  } else {

// ---- Server-synced favorites (shared across browsers) ----
// localStorage is per-browser; pushing to the server lets every browser
// and device see the same favorites. Failures are silent: local-only mode.
function pushFavoritesToServer() {
  try {
    fetch('/api/favs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ favs: getFavorites() }),
    }).catch(function() {});
  } catch (e) {}
}
function syncFavoritesFromServer() {
  try {
    fetch('/api/favs').then(function(r) { return r.json(); }).then(function(j) {
      if (!j || !j.ok || !Array.isArray(j.favs)) return;
      // Merge: server list ∪ local list (by id), keep server names.
      var local = getFavorites();
      var merged = j.favs.slice();
      for (var i = 0; i < local.length; i++) {
        if (!merged.some(function(f) { return f.id === local[i].id; })) merged.push(local[i]);
      }
      saveFavorites(merged);
      pushFavoritesToServer();
      renderFavorites();
      updateFavButton();
    }).catch(function() {});
  } catch (e) {}
}
function updateFavButton() {
  if (!selectedGroupId) return;

// ---- Search in post (accurate count + prev/next navigation) ----
var _postSearchIdx = -1;

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function searchInPost(q) {
  var body = document.querySelector('.post-body');
  var countEl = document.getElementById('postSearchCount');
  if (!body) return;
  if (!q.trim()) {
    // Strip any existing <mark> wrappers by restoring the plain text.
    if (body.querySelector('mark')) body.textContent = body.textContent;
    _postSearchIdx = -1;
    if (countEl) countEl.textContent = '';
    return;
  }
  // textContent ignores <mark> wrappers, so it always yields the stable full
  // text — counting on it (not innerHTML) avoids over-counting tags/entities.
  var text = body.textContent;
  var re = new RegExp(escapeRegExp(q), 'gi');
  var matches = text.match(re);
  var count = matches ? matches.length : 0;
  if (!count) {
    if (body.querySelector('mark')) body.textContent = text;
    _postSearchIdx = -1;
    if (countEl) countEl.textContent = '\u65e0\u5339\u914d';
    return;
  }
  var parts = [];
  var last = 0, idx = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(text)) !== null) {
    parts.push(escapeHtml(text.slice(last, m.index)));
    parts.push('<mark data-idx="' + idx + '">' + escapeHtml(m[0]) + '</mark>');
    idx++;
    last = m.index + m[0].length;
    if (m.index === re.lastIndex) re.lastIndex++;
  }
  parts.push(escapeHtml(text.slice(last)));
  body.innerHTML = parts.join('');
  _jumpPostMatch(0);
}

function _jumpPostMatch(idx) {
  var marks = document.querySelectorAll('.post-body mark');
  if (!marks.length) return;
  _postSearchIdx = ((idx % marks.length) + marks.length) % marks.length;
  for (var i = 0; i < marks.length; i++) marks[i].classList.remove('current');
  var cur = marks[_postSearchIdx];
  cur.classList.add('current');
  cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  var countEl = document.getElementById('postSearchCount');
  if (countEl) countEl.textContent = (_postSearchIdx + 1) + ' / ' + marks.length;
}

function postMatchNext() {
  if (_postSearchIdx < 0) return;
  _jumpPostMatch(_postSearchIdx + 1);
}
function postMatchPrev() {
  if (_postSearchIdx < 0) return;
  _jumpPostMatch(_postSearchIdx - 1);
}

// ---- Collapsible float menu (⋮ expands to back / refresh / scroll-top) ----
function collapseFloatMenu() {
  const fa = document.getElementById('floatActions');
  const more = document.getElementById('floatMore');
  if (!fa || !more) return;
  fa.classList.remove('expanded');
  more.textContent = '⋮';
  more.title = '更多操作';
  more.setAttribute('aria-expanded', 'false');
}
function toggleFloatMenu() {
  const fa = document.getElementById('floatActions');
  const more = document.getElementById('floatMore');
  if (!fa || !more) return;
  const exp = fa.classList.toggle('expanded');
  more.textContent = exp ? '✕' : '⋮';
  more.title = exp ? '收起' : '更多操作';
  more.setAttribute('aria-expanded', String(exp));
}
// While the menu is expanded, a click outside it only collapses the menu
// (capture phase intercepts the event before the clicked element's own
// handler runs, so no accidental navigation); a click on an action button
// collapses first, then the button's handler executes as usual.
document.addEventListener('click', function(e) {
  const fa = document.getElementById('floatActions');
  if (!fa || !fa.classList.contains('expanded')) return;
  const more = document.getElementById('floatMore');
  if (more && more.contains(e.target)) return; // ⋮ itself is handled by toggleFloatMenu
  if (fa.contains(e.target)) { collapseFloatMenu(); return; }
  e.preventDefault();
  e.stopPropagation();
  collapseFloatMenu();
}, true);

function showZoomIndicator(text) {

    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.style.opacity = '0'; }, 800);
}

  showToast(on ? '极简模式：图片需点击显示' : '已退出极简模式');

function applyMinimalMode() {
  var on = isMinimalMode();
  document.body.classList.toggle('minimal-mode', on);
  var boxes = document.querySelectorAll('.img-box');
  for (var i = 0; i < boxes.length; i++) {
    var box = boxes[i];

      box.dataset.url = img.dataset.url || img.getAttribute('src') || '';
      box.dataset.fb = img.dataset.fb || '';
      box.dataset.alt = img.getAttribute('alt') || '图片';
      box.dataset.fail = box.dataset.fail || 'placeholder';
      box.innerHTML = '<span class="img-ph-label">🖼 点击显示图片</span>';
      box.classList.add('ph');
      box.classList.remove('revealed');
      box.onclick = function(e) { e.preventDefault(); e.stopPropagation(); revealImg(this); };
    } else if (!on) {
      box.onclick = null;
      if (box.classList.contains('ph') && box.dataset.url) {
        box.innerHTML = imgHtml(box.dataset.url, box.dataset.fb, box.dataset.alt || '图片', box.dataset.fail || 'placeholder');
        box.classList.remove('ph');
      }
    }
  }
}
function revealImg(box) {
  if (!box || box.classList.contains('revealed')) return;
  box.classList.add('revealed');
  box.classList.remove('ph');
  box.innerHTML = imgHtml(box.dataset.url, box.dataset.fb, box.dataset.alt || '图片', box.dataset.fail || 'placeholder');
  // Clear the placeholder click handler so subsequent clicks bubble up to
  // the wrapping <a> and open the lightbox (openImg).
  box.onclick = null;
  box.removeAttribute('onclick');
}
function imgHtml(url, fb, alt, failMode) {
  var onerr = "if(!this.dataset.r){this.dataset.r=1;this.src=this.dataset.fb;this.referrerPolicy='no-referrer'}else if(!this.dataset.r2){this.dataset.r2=1;this.src=this.dataset.fb.indexOf('/raw/')>=0?this.dataset.fb.replace('/raw/','/l/'):this.dataset.fb}else{";
  onerr += failMode === 'hide'
    ? "this.parentElement.style.display='none'"
    : "this.parentElement.innerHTML='<span style=color:var(--text-muted);font-size:0.75rem;padding:12px>⚠ 图片加载失败</span>'";
  onerr += '}';
  return '<img src="' + escapeHtml(url) + '" data-url="' + escapeHtml(url) + '" data-fb="' + escapeHtml(fb) + '" alt="' + escapeHtml(alt || '图片') + '" loading="lazy" onerror="' + onerr + '">';
}
function imgBoxHtml(url, fb, alt, failMode) {
  var prox = '/api/image?url=' + encodeURIComponent(url);
  var fail = failMode || 'placeholder';
  if (isMinimalMode()) {
    return '<span class="img-box ph" data-url="' + escapeHtml(prox) + '" data-fb="' + escapeHtml(url) + '" data-alt="' + escapeHtml(alt || '图片') + '" data-fail="' + fail + '" onclick="event.preventDefault();event.stopPropagation();revealImg(this)"><span class="img-ph-label">🖼 点击显示图片</span></span>';
  }
  return '<span class="img-box" data-fail="' + fail + '">' + imgHtml(prox, url, alt, fail) + '</span>';
}
function openImg(el) {
  const img = el && el.tagName === 'IMG' ? el : (el ? el.querySelector('img') : null);
  if (!img || !img.dataset.url) return;
  // Gather every visible lightbox-able image so ←/→ can navigate between them.
  const all = document.querySelectorAll('.image-gallery img[data-url], .comment-imgs img[data-url]');
  const list = [];
  for (var i = 0; i < all.length; i++) list.push(all[i].dataset.url);
  const index = list.indexOf(img.dataset.url);
  openLightbox(img.dataset.url, list, index < 0 ? 0 : index);
}
function openLightbox(url, list, index) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  if (!lb || !img) return;
  lb._list = (list && list.length) ? list : [url];
  lb._index = index >= 0 ? index : 0;
  lb._zoom = 1; lb._tx = 0; lb._ty = 0;
  lb._drag = false;
  img.style.transform = 'scale(1) translate(0px,0px)';
  lb.classList.add('show');
  document.body.style.overflow = 'hidden';

  function applyTransform() {
    img.style.transform = 'scale(' + lb._zoom + ') translate(' + Math.round(lb._tx) + 'px,' + Math.round(lb._ty) + 'px)';
  }
  function updateCount() {
    var c = document.getElementById('lightboxCount');
    if (c) c.textContent = lb._list.length > 1 ? (lb._index + 1) + ' / ' + lb._list.length : '';
  }
  function showCurrent() {
    img.src = lb._list[lb._index];
    lb._zoom = 1; lb._tx = 0; lb._ty = 0;
    applyTransform();
    updateCount();
  }
  function nav(dir) {
    if (lb._list.length < 2) return;
    lb._index = (lb._index + dir + lb._list.length) % lb._list.length;
    showCurrent();
  }
  showCurrent();

  lb._onWheel = function(e) {
    e.preventDefault();
    var d = e.deltaY > 0 ? -0.1 : 0.1;
    lb._zoom = Math.max(0.3, Math.min(5, lb._zoom + d));
    applyTransform();
    showZoomIndicator(Math.round(lb._zoom * 100) + '%');
  };
  lb.addEventListener('wheel', lb._onWheel, { passive: false });

  // Keyboard: ←/→ previous/next image, 0 reset, +/- zoom.
  lb._onKey = function(e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
    else if (e.key === '0') { lb._zoom = 1; lb._tx = 0; lb._ty = 0; applyTransform(); showZoomIndicator('100%'); }
    else if (e.key === '+' || e.key === '=') { lb._zoom = Math.min(5, lb._zoom + 0.2); applyTransform(); showZoomIndicator(Math.round(lb._zoom * 100) + '%'); }
    else if (e.key === '-') { lb._zoom = Math.max(0.3, lb._zoom - 0.2); applyTransform(); showZoomIndicator(Math.round(lb._zoom * 100) + '%'); }
  };
  document.addEventListener('keydown', lb._onKey);

  // Double-click toggles between 1x and 2x zoom.
  img.ondblclick = function(e) {
    e.preventDefault();
    lb._zoom = lb._zoom > 1.05 ? 1 : 2;
    lb._tx = 0; lb._ty = 0;
    applyTransform();
    showZoomIndicator(Math.round(lb._zoom * 100) + '%');
  };

  // Drag to pan (only when zoomed in)
  img.onmousedown = function(e) {
    if (lb._zoom <= 1.05) return;
    e.preventDefault();
    lb._drag = true;
    var sx = e.clientX - lb._tx * lb._zoom;
    var sy = e.clientY - lb._ty * lb._zoom;
    img.style.cursor = 'grabbing';
    document.body.style.userSelect = 'none';

    document.onmousemove = function(ev) {
      if (!lb._drag) return;
      lb._tx = (ev.clientX - sx) / lb._zoom;
      lb._ty = (ev.clientY - sy) / lb._zoom;
      applyTransform();
    };
    document.onmouseup = function() {
      lb._drag = false;
      img.style.cursor = 'zoom-in';
      document.body.style.userSelect = '';
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  lb.classList.remove('show');
  document.body.style.overflow = '';
  document.body.style.userSelect = '';
  var img = document.getElementById('lightboxImg');
  if (img) { img.onmousedown = null; img.ondblclick = null; img.style.cursor = ''; }
  document.onmousemove = null;
  document.onmouseup = null;
  if (lb._onWheel) {
    lb.removeEventListener('wheel', lb._onWheel);
    delete lb._onWheel;
  }
  if (lb._onKey) {
    document.removeEventListener('keydown', lb._onKey);
    delete lb._onKey;
  }
  lb._list = null; lb._index = 0;
  var c = document.getElementById('lightboxCount');
  if (c) c.textContent = '';
  var zi = document.getElementById('zoomIndicator');
  if (zi) zi.style.opacity = '0';
}
// Image fallback is handled by each <img>'s inline onerror (proxy -> direct
// raw -> compressed l); a capture-phase handler here would pre-empt it and
// break the chain, so none is registered.

// ---- Keyboard shortcuts ----
function isTypingTarget(e) {
  var t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}
function toggleShortcuts() {
  var ov = document.getElementById('shortcutsOverlay');
  if (ov) ov.classList.toggle('show');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var ov = document.getElementById('shortcutsOverlay');
    if (ov && ov.classList.contains('show')) { ov.classList.remove('show'); return; }
    closeLightbox();
    return;
  }
  if (isTypingTarget(e) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') {
    toggleShortcuts();
  } else if (e.key.toLowerCase() === 'b') {
    floatBack();
  } else if (e.key.toLowerCase() === 'r') {
    floatRefresh();
  } else if (e.key === '/') {
    var s = document.querySelector('.disc-search, .post-search');
    if (s) { e.preventDefault(); s.focus(); s.select(); }
  }
});
document.addEventListener('scroll', function() {
  const el = document.getElementById('floatActions');
  if (!el) return;
  // Float actions (back / refresh / scroll-to-top) only appear while the
  // page is scrolled; at the top the toolbar provides the same actions.
  el.classList.toggle('show', window.scrollY > 150);
  if (window.scrollY <= 150) collapseFloatMenu();
  var h = document.querySelector('header');
  if (h) {
    if (window.scrollY > 10) { h.classList.add('scrolled'); }
    else { h.classList.remove('scrolled'); }
  }

  // Auto-load more discussions
  if (selectedGroupId && discussionFullData[selectedGroupId]) {
    var dl = discussionFullData[selectedGroupId];
    if (dl._vc && dl._vc < dl.length && window.scrollY + window.innerHeight >= document.body.scrollHeight - 400) {
      loadMoreDiscussions();
    }
  }

  // Auto-load more comments
  if (_postComments && _postComments.length) {
    if (_postComments._vc && _postComments._vc < _postComments.length && window.scrollY + window.innerHeight >= document.body.scrollHeight - 400) {
      loadMoreComments();
    }
  }
});

// ---- API calls ----

async function searchOrLoad(value) {
  value = value.trim();
  if (!value) return;
  // If it's all digits, treat as group ID
  if (/^\d+$/.test(value)) {
    loadGroup(value);
  } else {
    searchGroup(value);
  }
}

async function searchGroup(keyword) {
  document.getElementById('groupInput').value = keyword;
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  loading(`正在搜索「${escapeHtml(keyword)}」`);

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(keyword)}`);
    const json = await res.json();

    if (!json.ok || !json.results || json.results.length === 0) {
      setStatus(`没有找到相关小组`, 'error');
      app.innerHTML = emptyState('🔍', '没有找到相关小组', '试试其他关键词');
      return;
    }

    setStatus(`找到 ${json.results.length} 个小组`);
    let html = '<div class="section-title">搜索结果：' + escapeHtml(keyword) + '</div><ul class="group-list">';
    for (const g of json.results) {
      html += `<li><a href="#" onclick="loadGroup('${g.id}'); return false;">${escapeHtml(g.name)} <span class="group-id">${g.id}</span></a></li>`;
    }
    html += '</ul>';
    app.innerHTML = html;
  } catch (err) {
    setStatus(`搜索失败: ${err.message}`, 'error');
  }
}

async function loadGroup(id) {
  _savedVc = 0;
  _savedScrollY = 0;
  id = id.trim();
  if (!id) return;
  if (!/^[A-Za-z0-9_-]+$/.test(id)) {
    setStatus('无效的小组 ID', 'error');
    return;
  }

  document.getElementById('groupInput').value = id;
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  loading(`正在获取小组 ${escapeHtml(id)}`);

  try {
    const res = await fetch(`/api/group?id=${encodeURIComponent(id)}`);
    const json = await res.json();

    if (!json.ok) {
      setStatus(`请求失败: ${json.error || '未知错误'}`, 'error');
      app.innerHTML = emptyState('⚠', '获取数据失败', '请检查小组 ID 是否正确');
      return;
    }

    setStatus(`小组 ${escapeHtml(id)} · ${json.data.discussions.length} 个讨论`);
    discussionCache[id] = json.data;
    saveRecentGroup(id, json.data.groupName || `小组 ${id}`);
    if (Object.keys(discussionCache).length > 30) {
      delete discussionCache[Object.keys(discussionCache)[0]];
    }
    showDiscussions(id, json.data);
  } catch (err) {
    setStatus(`网络错误: ${err.message}`, 'error');
    app.innerHTML = emptyState('⚠', '无法连接到服务器', '请检查服务是否在运行');
  }
}

async function loadPost(groupId, postId) {
  selectedPostId = postId;
  if (groupId) selectedGroupId = groupId;
  markRead(selectedGroupId, postId);
  _savedScrollY = window.scrollY;
  if (selectedGroupId && discussionFullData[selectedGroupId]) {
    _savedVc = discussionFullData[selectedGroupId]._vc || 30;
  }
  loading(`正在获取帖子详情`);

  try {
    const res = await fetch(`/api/post?id=${encodeURIComponent(postId)}`);
    const json = await res.json();

    if (!json.ok) {
      setStatus(`请求失败: ${json.error || '未知错误'}`, 'error');
      return;
    }

    setStatus(`帖子: ${escapeHtml((json.data.title || '').substring(0, 40))}`);
    showPost(groupId, json.data);
  } catch (err) {
    setStatus(`网络错误: ${err.message}`, 'error');
  }
}

function toggleFavorite(groupId) {
  const data = discussionCache[groupId];
  if (!data) return;
  const name = data.groupName || `小组 ${groupId}`;
  let favs = getFavorites();
  const idx = favs.findIndex(f => f.id === groupId);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    favs.push({ id: groupId, name });
  }
  saveFavorites(favs);
  renderFavorites();
  pushFavoritesToServer();
  showToast(favs.some(function(f) { return f.id === groupId; }) ? '已收藏 ' + name : '已取消' + name);
  // Only update the star button in place; re-rendering the whole list here
  // would reset scroll position and push a duplicate history entry.
  updateFavButton();
}

// Remove a group from favorites (used by the × button on favorite tags).
function removeFavorite(groupId) {
  var favs = getFavorites();
  var f = favs.find(function(x) { return x.id === groupId; });
  var name = f ? f.name : ('小组 ' + groupId);
  if (!confirm('确定取消收藏「' + name + '」吗？')) return;
  favs = favs.filter(function(x) { return x.id !== groupId; });
  saveFavorites(favs);
  renderFavorites();
  pushFavoritesToServer();
  updateFavButton();
  showToast('已取消收藏');
}

function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  const btn = document.getElementById('themeToggle');
  // Icon shows the CURRENT theme; the title describes what the next click does.
  btn.textContent = next === 'dark' ? '☾' : '☀';
  btn.title = next === 'dark' ? '切换到亮色主题' : '切换到暗色主题';
  btn.setAttribute('aria-pressed', String(next === 'dark'));
  localStorage.setItem('douban_theme', next);
}

// ---- Hot groups on load ----
window.addEventListener('popstate', function(e) {
  var st = e.state;
  if (!st) { showWelcome(); return; }
  _isHistoryRestore = true;
  if (st.view === 'group' && st.groupId) {
    if (discussionCache[st.groupId]) { showDiscussions(st.groupId, discussionCache[st.groupId]); }
    else { loadGroup(st.groupId); }
  } else if (st.view === 'post' && st.groupId && st.postId) {
    loadPost(st.groupId, st.postId);
  } else {
    showWelcome();
  }
});
history.replaceState({view:'welcome'}, '');
(async function init() {
  const saved = localStorage.getItem('douban_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const tb = document.getElementById('themeToggle');
  if (tb) {
    tb.textContent = saved === 'dark' ? '☾' : '☀';
    tb.title = saved === 'dark' ? '切换到亮色主题' : '切换到暗色主题';
    tb.setAttribute('aria-pressed', String(saved === 'dark'));
  }
  try {
    const res = await fetch('/api/hot');
    const json = await res.json();
    if (json.ok && json.results && json.results.length > 0) {
      const nav = document.getElementById('quickNav');
      if (nav) {
        nav.innerHTML = json.results.slice(0, 12).map(g =>
          `<button onclick="loadGroup('${g.id}')">${escapeHtml(g.name)}</button>`
        ).join('');
      }
    }
  } catch {}
  renderFavorites();
  // Minimal mode: restore body class and button state.
  document.body.classList.toggle('minimal-mode', isMinimalMode());
  var mBtn = document.getElementById('minimalToggle');
  if (mBtn) { mBtn.classList.toggle('active', isMinimalMode()); mBtn.setAttribute('aria-pressed', String(isMinimalMode())); }
  // Pull server-side favorites so all browsers share the same list.
  syncFavoritesFromServer();
})();
